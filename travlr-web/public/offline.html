<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline | Travlr</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f4f4f5;
            background: #0a0a0a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: radial-gradient(circle at top, #172554 0, #0a0a0a 52%);
        }

        main {
            width: min(100%, 34rem);
            padding: clamp(2rem, 7vw, 4rem);
            border: 1px solid #27272a;
            border-radius: 1.5rem;
            background: rgba(24, 24, 27, .92);
            text-align: center;
            box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, .35);
        }

        .eyebrow {
            color: #93c5fd;
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 1rem 0 .75rem;
            font-size: clamp(1.75rem, 6vw, 2.5rem);
        }

        p {
            margin: 0;
            color: #a1a1aa;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: .75rem 1.1rem;
            border-radius: 999px;
            background: #3b82f6;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        a:focus-visible {
            outline: 3px solid #bfdbfe;
            outline-offset: 4px;
        }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow">Travlr offline</p>
        <h1>You’re offline</h1>
        <p>This page isn’t available without a connection. Your private Travlr route was kept intact instead of being replaced with the public home page.</p>
        <a href="/">Return to Travlr home</a>
    </main>
</body>

</html>
